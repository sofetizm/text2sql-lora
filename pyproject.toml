[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "t2s"
version = "0.1.0"
description = "Дообучение небольшой LLM (QLoRA) для генерации SQL и честное сравнение с базовой моделью и API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyyaml>=6", "matplotlib>=3.7"]

[project.optional-dependencies]
train = [
    "torch>=2.3",
    "transformers>=4.56",
    "peft>=0.13",
    "accelerate>=1.0",
    "bitsandbytes>=0.45; platform_system == 'Linux'",
    "datasets>=3.0",
]
api = ["openai>=1.40"]
demo = ["gradio>=5.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = ["slow: требует torch, обучает крошечную модель на CPU"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
